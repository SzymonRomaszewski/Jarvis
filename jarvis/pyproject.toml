[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-mac"
version = "1.0.0"
description = "A voice-controlled AI assistant for your Mac, with a glowing HUD. Free tiers, local speech, acts on your Mac."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["voice-assistant", "jarvis", "macos", "llm", "whisper", "speech-recognition", "text-to-speech", "ai-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "numpy",
    "requests",
    "sounddevice",
    "onnxruntime",
    "openwakeword",
    "mlx-whisper; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
claude = ["anthropic"]
kokoro = ["kokoro-onnx"]
piper = ["piper-tts"]
menubar = ["rumps"]
dev = ["playwright", "pillow"]

[project.urls]
Homepage = "https://github.com/YOUR-USERNAME/jarvis"
Issues = "https://github.com/YOUR-USERNAME/jarvis/issues"

[project.scripts]
jarvis = "jarvis:main"

[tool.setuptools]
py-modules = ["jarvis"]
